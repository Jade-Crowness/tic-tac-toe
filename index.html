<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./permanent.css">
    <link rel="stylesheet" href="./main_styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <div>Tic Tac Toe</div>
    </header>
    <main>
        <div id="gameboard">
            <div index="0" class="gameCell"></div>
            <div index="1" class="gameCell"></div>
            <div index="2" class="gameCell"></div>
            <div index="3" class="gameCell"></div>
            <div index="4" class="gameCell"></div>
            <div index="5" class="gameCell"></div>
            <div index="6" class="gameCell"></div>
            <div index="7" class="gameCell"></div>
            <div index="8" class="gameCell"></div>
        </div>
    </main>
    <footer>
        <div>Thank You For Visiting</div>
    </footer>
</body>
</html>
