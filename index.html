<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./permanent.css">
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="./header.css">
    <link rel="stylesheet" href="./footer.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>
    <main>
        <div id="gameboard">
            <div cell-index="0" class="gameCell"></div>
            <div cell-index="1" class="gameCell"></div>
            <div cell-index="2" class="gameCell"></div>
            <div cell-index="3" class="gameCell"></div>
            <div cell-index="4" class="gameCell"></div>
            <div cell-index="5" class="gameCell"></div>
            <div cell-index="6" class="gameCell"></div>
            <div cell-index="7" class="gameCell"></div>
            <div cell-index="8" class="gameCell"></div>
        </div>
        <button id="resetData">Reset</button>
    </main>
    <footer>
        <div>Thank You For Visiting</div>
    </footer>
</body>
</html>
