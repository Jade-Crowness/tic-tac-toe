<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./permanent_styles.css">
    <link rel="stylesheet" href="./main_styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <div>Tic Tac Toe</div>
    </header>
    <main>
        <div id="gameboard">
            <div cell-index="0" class="gameCell">0</div>
            <div cell-index="1" class="gameCell">1</div>
            <div cell-index="2" class="gameCell">2</div>
            <div cell-index="3" class="gameCell">3</div>
            <div cell-index="4" class="gameCell">4</div>
            <div cell-index="5" class="gameCell">5</div>
            <div cell-index="6" class="gameCell">6</div>
            <div cell-index="7" class="gameCell">7</div>
            <div cell-index="8" class="gameCell">8</div>
        </div>
    </main>
    <footer>
        <div>Thank You For Visiting</div>
    </footer>
</body>
</html>
